# PSO optimizer configuration
# Cost is roughly population_size * n_iterations evaluations.

# Number of particles.
population_size = 1000

# Number of iterations.
n_iterations = 50

# Initial inertia weight.
inertia_weight = 0.7

# Final inertia weight; interpolated linearly from inertia_weight.
inertia_weight_end = 0.4

# Pull toward each particle's personal best.
cognitive_coefficient = 1.5

# Pull toward the global best.
social_coefficient = 1.5

# Velocity limit as a fraction of each parameter range.
max_velocity_ratio = 0.2

# Stop after this many iterations without enough improvement.
early_stop_patience = 10

# Minimum fitness improvement counted by early stopping.
early_stop_min_delta = 1e-6
